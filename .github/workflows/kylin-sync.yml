name: Kylin sync

# Keeps the `kylin` branch on the newest upstream release tag and lets
# `Kylin build` package and publish it.
#
# The push uses a personal access token (`KYLIN_SYNC_TOKEN`, contents +
# workflows write) rather than GITHUB_TOKEN, for two reasons:
#   * GITHUB_TOKEN may not create or update files under .github/workflows/,
#     and an upstream merge routinely does;
#   * events caused by GITHUB_TOKEN do not start other workflows, so the
#     kylin-v* tag push would not trigger the build.
# A token push does trigger it, so no separate dispatch is needed.
#
# Scheduled workflows run from the default branch, which is why this file also
# lives on `main`; it checks out `kylin` itself.
#
# GitHub disables schedules in a repository after 60 days without activity, so
# a quiet fork needs this workflow re-enabled from the Actions tab.

on:
  schedule:
    - cron: "0 3 * * *" # 11:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to sync (empty = newest stable tag)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: kylin-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/l0ng-ai/openidea.git

jobs:
  sync:
    name: Sync upstream tag
    runs-on: ubuntu-latest
    steps:
      - name: Check the token
        env:
          SYNC_TOKEN: ${{ secrets.KYLIN_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::KYLIN_SYNC_TOKEN is not set: add a fine-grained token with contents and workflows write"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: kylin
          fetch-depth: 0
          token: ${{ secrets.KYLIN_SYNC_TOKEN }}

      - name: Pick the newest stable tag
        id: pick
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM"
          git fetch --tags --quiet upstream
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then
            # Nightlies (v0.1.41-nightly.…) are skipped on purpose: they are
            # rebuilt every day and would keep this job busy for nothing.
            tag=$(git tag --list 'v*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1)
          fi
          test -n "$tag" || { echo "::error::no upstream tag found"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "picked $tag"

      - name: Merge it into kylin
        run: |
          set -euo pipefail
          tag='${{ steps.pick.outputs.tag }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "kylin already contains $tag"
          else
            git merge --no-edit "$tag"
          fi

      # Two packages come from one merge: the desktop app and the offline
      # language pack. Each tag is checked on its own, so a run that only
      # failed to publish one of them can add it later.
      - name: Check which packages are already published
        id: version
        run: |
          set -euo pipefail
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          new=true
          if git ls-remote --exit-code --tags origin "refs/tags/kylin-v$version" >/dev/null 2>&1; then new=false; fi
          server_new=true
          if git ls-remote --exit-code --tags origin "refs/tags/kylin-server-v$version" >/dev/null 2>&1; then server_new=false; fi
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "server_new=$server_new" >> "$GITHUB_OUTPUT"
          echo "desktop app: $new, language server pack: $server_new"

      # The tag pushes are what start `Kylin build` and `Kylin language server
      # pack`; the branch push only keeps `kylin` current, so it carries no
      # build trigger of its own.
      - name: Push the branch and the tags
        if: steps.version.outputs.new == 'true' || steps.version.outputs.server_new == 'true'
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          git push origin kylin
          if [ '${{ steps.version.outputs.new }}' = true ]; then
            git tag "kylin-v$version"
            git push origin "kylin-v$version"
            echo "pushed kylin-v$version"
          fi
          if [ '${{ steps.version.outputs.server_new }}' = true ]; then
            git tag "kylin-server-v$version"
            git push origin "kylin-server-v$version"
            echo "pushed kylin-server-v$version"
          fi
